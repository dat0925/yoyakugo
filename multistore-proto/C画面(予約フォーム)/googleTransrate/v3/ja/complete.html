                    <span>受付・予約者情報</span>

                      <div class="cell cell-1 text-right">お名前</div>

                    </div>
                    <div class="row">
                      <div class="cell cell-1 text-right">メールアドレス</div>
                      <div class="cell cell-2">test@iflag.co.jp</div>
                    </div>

                    </div>
