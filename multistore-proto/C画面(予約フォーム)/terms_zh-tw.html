            <p style="white-space: pre-wrap;">第1條（適用）
本條款規定本診所提供的線上預約服務（以下簡稱「本服務」）的使用條件。使用本服務即視為同意本條款。

第2條（預約申請）
使用者可透過本服務申請本診所的就診預約。本診所發送確認郵件時，預約即告成立。

第3條（取消）
取消預約請至少於預約時間24小時前聯繫本所。若多次爽約，可能拒絕今後的預約。

第4條（禁止行為）
使用者不得從事以下行為：
・登記虛假資訊
・未經授權使用他人個人資訊
・妨礙本服務營運的行為

第5條（免責）
