  <head>

    <meta charset="utf-8">

    <meta property="og:image" content="">

    <link href="./assets/css/main.css" rel="stylesheet">

  </head>
  <body>
    <header>
      <div class="primary_header">
        <div class="container">
          <div class="row">
            <h1 class="title"> ●● Klinik Osteopati </h1>
            <div class="flow">
              <ul>
                <li>Detail</li>
                <li class="active">Konfirmasi</li>
                <li>Selesai</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
      <form action="./complete_id.html" method="post">
        <section class="confirm01">
          <div class="container gutters">
            <div class="text-center text-xlarge">Check-in / reservasi Anda belum selesai.</div>
            <div class="text-center text-large">Harap tinjau informasi yang dimasukkan dan klik "Selesaikan check-in / reservasi" jika semuanya benar.</div>
            <div class="box">
              <ul>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>Detail check-in / reservasi</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">Jumlah Tamu</div>
                        <div class="cell cell-2">1</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Layanan</div>
                        <div class="cell cell-2">
                          <div class="confirm_menu_name">Nama Menu Nama Menu</div>
                          <ul class="confirm_option_list">
                            <li>+Nama Menu Opsi Nama Menu Opsi</li>
                            <li>+Nama Menu Opsi Nama Menu Opsi</li>
                          </ul>
                        </div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Tanggal & Waktu</div>
                        <div class="cell cell-2">1 Desember 2025 (Sen) 10:30</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Staf</div>
                        <div class="cell cell-2">店舗花子</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Biaya (termasuk pajak)</div>
                        <div class="cell cell-2">3,000 JPY</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Waktu Diperlukan</div>
                        <div class="cell cell-2">45 menit</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>Informasi Reservasi</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">Nama</div>
                        <div class="cell cell-2">Yamada Taro</div>
                      </div>
                      <div class="row" id="furigana_row">
                        <div class="cell cell-1 text-right">Nama (Furigana)</div>
                        <div class="cell cell-2"></div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Nomor Telepon</div>
                        <div class="cell cell-2">03-0000-1111</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Alamat Email</div>
                        <div class="cell cell-2">test@iflag.co.jp</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Komentar</div>
                        <div class="cell cell-2">Saya ingin praktisi perempuan.</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>Verifikasi Email</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">Kode PIN</div>
                        <div class="cell cell-2">
                          <div class="pin_input_wrapper">
                            <input type="text" class="input_pin" id="pinCode" placeholder="" maxlength="6" pattern="\d{6}">
                            <div class="pin_progress" id="pinTimer">
                              <div class="progress_header">
                                <div class="progress_label">Berlaku Hingga</div>
                                <div class="progress_text" id="progressText">01:00</div>
                              </div>
                              <div class="progress_bar">
                                <div class="progress_fill" id="progressFill"></div>
                              </div>
                              <div class="resend_link" id="resendLink" style="display: none;">
                                <a href="./index_id.html">Kirim Ulang Kode PIN</a>
                              </div>
                            </div>
                          </div>
                          <div class="pin_code_notice">
                            <p>Email verifikasi telah dikirim ke test@iflag.co.jp.</p>
                            <p>Masukkan kode PIN dari email.</p>
                            <p class="attention_point">Jika tidak menerima email, periksa folder spam<br/>atau verifikasi alamat email dan kirim ulang.</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  </label>
                </li>
              </ul>
              <div class="input_wrap">
                <div class="back_wrap"><a href="./index_id.html">Ubah detail check-in / reservasi</a></div>
                <p class="submit_wrap">
                  <input type="submit" value="Selesaikan check-in / reservasi">
                </p>
              </div>
            </div>
          </div>
        </section>
      </form>
      <div class="foot">© 2025 IFLAG Co, Ltd.</div>

    <script src="./assets/js/main.js"></script>
