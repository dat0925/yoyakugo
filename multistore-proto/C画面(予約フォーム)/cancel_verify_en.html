<!doctype html>
<html class="no-js" lang="en">
  <head>
  <script src="../pin_gate.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>Cancel Check-in / Reservation (Identity Verification)｜●● Osteopathic Clinic</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="./assets/css/main.css" rel="stylesheet">
  </head>
  <body>
    <header>
      <div class="primary_header">
        <div class="container">
          <div class="row">
            <h1 class="title"> ●● Osteopathic Clinic </h1>
            <div class="flow">
              <ul>
                <li class="active">Identity Verification</li>
                <li>Cancel Confirmation</li>
                <li>Cancel Complete</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
      <form action="./cancel_confirm_en.html" method="get" id="cancelVerifyForm" novalidate>
        <section class="confirm01 cancel-flow">
          <div class="container gutters">
            <div class="text-center text-xlarge">Cancel Check-in / Reservation (Identity Verification)</div>
            <div class="text-center text-large cancel-lead">
              Please enter the <strong>last 4 digits</strong> of the phone number registered at check-in / reservation.
            </div>
            <div class="alert alert-danger alert-error-message clear-after-action" id="alert-error-message" style="display:none"></div>
            <div class="box">
              <ul>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>Phone Number (Last 4 Digits)</span>
                    </span>
                    <div class="table-container">
                      <div class="row cancel-tel-row">
                        <div class="cell cell-1 text-right cancel-tel-label-cell">Last 4 digits<span class="required">Required</span></div>
                        <div class="cell cell-2">
                          <div class="cancel-tel-last4-wrap">
                            <input type="text" class="input_tel02 cancel-tel-last4" id="telLast4_1" name="telLast4_1" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Phone number last 4 digits 1">
                            <input type="text" class="input_tel02 cancel-tel-last4" id="telLast4_2" name="telLast4_2" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Phone number last 4 digits 2">
                            <input type="text" class="input_tel02 cancel-tel-last4" id="telLast4_3" name="telLast4_3" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Phone number last 4 digits 3">
                            <input type="text" class="input_tel02 cancel-tel-last4" id="telLast4_4" name="telLast4_4" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Phone number last 4 digits 4">
                          </div>
                          <p class="cancel-help-text">e.g. For 03-0000-<strong>1111</strong>, enter "1111"</p>
                        </div>
                      </div>
                    </div>
                  </label>
                </li>
              </ul>
              <div class="input_wrap">
                <p class="submit_wrap">
                  <input type="submit" value="Verify">
                </p>
              </div>
            </div>
          </div>
        </section>
      </form>
      <div class="foot">© 2025 IFLAG Co, Ltd.</div>
    </main>
    <script>
      (function() {
        var telErrorMessage = 'The last 4 digits are invalid. Please enter them again.';
        var form = document.getElementById('cancelVerifyForm');
        var alertError = document.getElementById('alert-error-message');
        var inputs = document.querySelectorAll('.cancel-tel-last4');

        function showAlertError(message) {
          alertError.innerHTML = '<p>' + message + '</p>';
          alertError.style.display = '';
        }

        function clearAlertError() {
          alertError.innerHTML = '';
          alertError.style.display = 'none';
        }

        inputs.forEach(function(input, index) {
          input.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 1);
            clearAlertError();
            if (this.value && inputs[index + 1]) {
              inputs[index + 1].focus();
            }
          });
          input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && !this.value && inputs[index - 1]) {
              inputs[index - 1].focus();
            }
          });
        });

        form.addEventListener('submit', function(e) {
          e.preventDefault();
          clearAlertError();
          var telLast4 = '';
          inputs.forEach(function(input) {
            telLast4 += input.value;
          });
          if (!/^[0-9]{4}$/.test(telLast4) || telLast4 !== '1111') {
            showAlertError(telErrorMessage);
            return false;
          }
          window.location.href = form.getAttribute('action');
          return false;
        });
      })();
    </script>
  </body>
</html>
