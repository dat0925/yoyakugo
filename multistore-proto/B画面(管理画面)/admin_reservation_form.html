<!doctype html>
<html lang="ja">
<head>
  <script src="../pin_gate.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>受付・予約登録｜管理画面モック</title>
    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            var mode = params.get('mode') || 'new';
            var qs = new URLSearchParams();
            if (mode === 'edit') {
                qs.set('open', 'edit');
            } else if (params.get('tab') === 'block') {
                qs.set('open', 'block');
            } else {
                qs.set('open', 'new');
            }
            ['id', 'date', 'time', 'resource'].forEach(function (key) {
                if (params.get(key)) qs.set(key, params.get(key));
            });
            location.replace('./admin_reservations.html?' + qs.toString());
        })();
    </script>
</head>
<body>
    <p>受付・予約管理画面のモーダルへ移動しています…</p>
    <p><a href="./admin_reservations.html">受付・予約管理へ戻る</a></p>
</body>
</html>
