<!doctype html>
<html class="no-js" lang="ja">
  <head>
  <script src="../pin_gate.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>受付・予約キャンセルの確認｜●●接骨院</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="./assets/css/main.css" rel="stylesheet">
  </head>
  <body>
    <header>
      <div class="primary_header">
        <div class="container">
          <div class="row">
            <h1 class="title"> ●●接骨院 </h1>
            <div class="flow">
              <ul>
                <li>本人確認</li>
                <li class="active">キャンセル確認</li>
                <li>キャンセル完了</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
      <form action="./cancel_complete.html" method="get">
        <section class="confirm01 cancel-flow">
          <div class="container gutters">
            <div class="text-center text-xlarge">受付・予約キャンセルの確認</div>
            <div class="text-center text-large cancel-lead">
              内容をご確認のうえ、問題なければ「受付・予約をキャンセルする」ボタンをクリックしてください。
            </div>
            <div class="box">
              <ul>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>キャンセル対象の受付・予約内容</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">受付・予約番号</div>
                        <div class="cell cell-2">12345</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">人数</div>
                        <div class="cell cell-2">1人</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">受付内容</div>
                        <div class="cell cell-2">
                          <div class="confirm_menu_name">メニュー名メニュー名</div>
                          <ul class="confirm_option_list">
                            <li>+オプションメニュー名オプションメニュー名</li>
                            <li>+オプションメニュー名オプションメニュー名</li>
                          </ul>
                        </div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">受付日時</div>
                        <div class="cell cell-2">2026年6月15日（月）10:30</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">担当者</div>
                        <div class="cell cell-2">店舗花子</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">料金(税込)</div>
                        <div class="cell cell-2">3,000円</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">所要時間</div>
                        <div class="cell cell-2">45分</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>受付・予約者情報</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">お名前</div>
                        <div class="cell cell-2">山田　太郎</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">お名前（フリガナ）</div>
                        <div class="cell cell-2">ヤマダ　タロウ</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">電話番号</div>
                        <div class="cell cell-2">03-0000-1111</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">メールアドレス</div>
                        <div class="cell cell-2">test@iflag.co.jp</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">コメント</div>
                        <div class="cell cell-2">女性の先生を希望します。</div>
                      </div>
                    </div>
                  </label>
                </li>
              </ul>
              <div class="cancel-notice-box">
                <p>1度キャンセルすると元に戻すことは出来ません。</p>
                <p>キャンセル完了後、登録メールアドレス宛にキャンセル完了メールを送信します。</p>
              </div>
              <div class="input_wrap">
                <p class="submit_wrap cancel-submit-wrap">
                  <input type="submit" value="受付・予約をキャンセルする" class="cancel-submit-btn">
                </p>
              </div>
            </div>
          </div>
        </section>
      </form>
      <div class="foot">© 2025 IFLAG Co, Ltd.</div>
    </main>
  </body>
</html>
