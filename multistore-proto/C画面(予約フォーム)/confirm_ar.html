    <main>
      <form action="./complete_ar.html" method="post">

            <div class="box">

                  <label>

                      <span>تفاصيل تسجيل الوصول / الحجز</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">عدد الضيوف</div>
                        <div class="cell cell-2">1</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">الخدمة</div>
                        <div class="cell cell-2">

                            <li>+اسم قائمة الخيارات اسم قائمة الخيارات</li>
                            <li>+اسم قائمة الخيارات اسم قائمة الخيارات</li>

                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">الموظف</div>

                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">السعر (شامل الضريبة)</div>
                        <div class="cell cell-2">3,000 JPY</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">الوقت المطلوب</div>
                        <div class="cell cell-2">45 دقيقة</div>
                      </div>
                    </div>
                  </label>
                </li>

                    <span class="title_txt">
                      <span>معلومات الحجز</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">الاسم</div>
                        <div class="cell cell-2">Yamada Taro</div>
                      </div>
                      <div class="row" id="furigana_row">
                        <div class="cell cell-1 text-right">الاسم (فوريغانا)</div>
                        <div class="cell cell-2"></div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">رقم الهاتف</div>
                        <div class="cell cell-2">03-0000-1111</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">البريد الإلكتروني</div>
                        <div class="cell cell-2">test@iflag.co.jp</div>
                      </div>

                        <div class="cell cell-1 text-right">رمز PIN</div>
                        <div class="cell cell-2">
                          <div class="pin_input_wrapper">
                            <input type="text" class="input_pin" id="pinCode" placeholder="" maxlength="6" pattern="\d{6}">
                            <div class="pin_progress" id="pinTimer">
                              <div class="progress_header">
                                <div class="progress_label">صالح حتى</div>
                                <div class="progress_text" id="progressText">01:00</div>
                              </div>
                              <div class="progress_bar">
                                <div class="progress_fill" id="progressFill"></div>
                              </div>
                              <div class="resend_link" id="resendLink" style="display: none;">
                                <a href="./index_ar.html">إعادة إرسال رمز PIN</a>
                              </div>
                            </div>
                          </div>
                          <div class="pin_code_notice">
                            <p>تم إرسال بريد تحقق إلى test@iflag.co.jp.</p>
                            <p>أدخل رمز PIN من البريد.</p>
