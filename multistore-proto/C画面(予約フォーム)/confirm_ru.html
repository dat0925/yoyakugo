<!doctype html>
<html class="no-js" lang="ru">
  <head>
  <script src="../pin_gate.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <link rel="canonical" href="http://www./">
    <title></title>
    <meta name="keywords" content="">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:url" content="http://www./">
    <meta property="og:type" content="website">
    <meta property="og:image" content="">
    <meta property="og:title" content="">
    <meta property="og:site_name" content="">
    <meta property="og:description" content="">
    <link href="./assets/css/main.css" rel="stylesheet">
    <script src="./assets/js/vendor/jquery.min.js"></script>
  </head>
  <body>
    <header>
      <div class="primary_header">
        <div class="container">
          <div class="row">
            <h1 class="title"> ●● Остеопатическая клиника </h1>
            <div class="flow">
              <ul>
                <li>Детали</li>
                <li class="active">Подтвердить</li>
                <li>Завершить</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
      <form action="./complete_ru.html" method="post">
        <section class="confirm01">
          <div class="container gutters">
            <div class="text-center text-xlarge">Ваша регистрация / бронирование ещё не завершены.</div>
            <div class="text-center text-large">Проверьте введённые данные и нажмите «Завершить регистрацию / бронирование», если всё верно.</div>
            <div class="box">
              <ul>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>Детали регистрации / бронирования</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">Число гостей</div>
                        <div class="cell cell-2">1</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Услуга</div>
                        <div class="cell cell-2">
                          <div class="confirm_menu_name">Название меню Название меню</div>
                          <ul class="confirm_option_list">
                            <li>+Название доп. меню Название доп. меню</li>
                            <li>+Название доп. меню Название доп. меню</li>
                          </ul>
                        </div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Дата и время</div>
                        <div class="cell cell-2">1 декабря 2025 (пн) 10:30</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Сотрудник</div>
                        <div class="cell cell-2">店舗花子</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Стоимость (с налогом)</div>
                        <div class="cell cell-2">3,000 JPY</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Необходимое время</div>
                        <div class="cell cell-2">45 минут</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>Информация о бронировании</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">Имя</div>
                        <div class="cell cell-2">Yamada Taro</div>
                      </div>
                      <div class="row" id="furigana_row">
                        <div class="cell cell-1 text-right">Имя (фуригана)</div>
                        <div class="cell cell-2"></div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Номер телефона</div>
                        <div class="cell cell-2">03-0000-1111</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Адрес электронной почты</div>
                        <div class="cell cell-2">test@iflag.co.jp</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Комментарии</div>
                        <div class="cell cell-2">Хочу, чтобы меня приняла женщина-специалист.</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>Подтверждение e-mail</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">PIN-код</div>
                        <div class="cell cell-2">
                          <div class="pin_input_wrapper">
                            <input type="text" class="input_pin" id="pinCode" placeholder="" maxlength="6" pattern="\d{6}">
                            <div class="pin_progress" id="pinTimer">
                              <div class="progress_header">
                                <div class="progress_label">Действителен до</div>
                                <div class="progress_text" id="progressText">01:00</div>
                              </div>
                              <div class="progress_bar">
                                <div class="progress_fill" id="progressFill"></div>
                              </div>
                              <div class="resend_link" id="resendLink" style="display: none;">
                                <a href="./index_ru.html">Отправить PIN-код повторно</a>
                              </div>
                            </div>
                          </div>
                          <div class="pin_code_notice">
                            <p>Письмо с подтверждением отправлено на test@iflag.co.jp.</p>
                            <p>Введите PIN-код из письма.</p>
                            <p class="attention_point">Если письмо не пришло, проверьте спам<br/>или подтвердите адрес e-mail и отправьте снова.</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  </label>
                </li>
              </ul>
              <div class="input_wrap">
                <div class="back_wrap"><a href="./index_ru.html">Изменить детали регистрации / бронирования</a></div>
                <p class="submit_wrap">
                  <input type="submit" value="Завершить регистрацию / бронирование">
                </p>
              </div>
            </div>
          </div>
        </section>
      </form>
      <div class="foot">© 2025 IFLAG Co, Ltd.</div>
    </main>

    <script src="./assets/js/main.js"></script>
  </body>
</html>
