<!doctype html>
<html class="no-js" lang="zh-tw">
  <head>
  <script src="../pin_gate.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <link rel="canonical" href="http://www./">
    <title></title>
    <meta name="keywords" content="">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:url" content="http://www./">
    <meta property="og:type" content="website">
    <meta property="og:image" content="">
    <meta property="og:title" content="">
    <meta property="og:site_name" content="">
    <meta property="og:description" content="">
    <link href="./assets/css/main.css" rel="stylesheet">
    <script src="./assets/js/vendor/jquery.min.js"></script>
  </head>
  <body>
    <header>
      <div class="primary_header">
        <div class="container">
          <div class="row">
            <h1 class="title"> ●●接骨院 </h1>
            <div class="flow">
              <ul>
                <li>詳細資訊</li>
                <li class="active">確認</li>
                <li>完成</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
      <form action="./complete_zh-tw.html" method="post">
        <section class="confirm01">
          <div class="container gutters">
            <div class="text-center text-xlarge">您的預約/就診尚未完成。</div>
            <div class="text-center text-large">請確認您填寫的內容，無誤後點擊「完成預約」按鈕。</div>
            <div class="box">
              <ul>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>預約/就診資訊</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">人數</div>
                        <div class="cell cell-2">1人</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">項目</div>
                        <div class="cell cell-2">
                          <div class="confirm_menu_name">項目名稱</div>
                          <ul class="confirm_option_list">
                            <li>+加購項目名稱加購項目名稱</li>
                            <li>+加購項目名稱加購項目名稱</li>
                          </ul>
                        </div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">日期與時間</div>
                        <div class="cell cell-2">12月1日（一）10:30</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">服務人員</div>
                        <div class="cell cell-2">店舗花子</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">費用（含稅）</div>
                        <div class="cell cell-2">3,000 JPY</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">所需時間</div>
                        <div class="cell cell-2">45分鐘</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>預約資訊</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">姓名</div>
                        <div class="cell cell-2">Yamada Taro</div>
                      </div>
                      <div class="row" id="furigana_row">
                        <div class="cell cell-1 text-right">姓名（假名）</div>
                        <div class="cell cell-2"></div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">電話號碼</div>
                        <div class="cell cell-2">03-0000-1111</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">電子郵件</div>
                        <div class="cell cell-2">test@iflag.co.jp</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">備註</div>
                        <div class="cell cell-2">I would like a female practitioner.</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>郵件驗證</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">驗證碼</div>
                        <div class="cell cell-2">
                          <div class="pin_input_wrapper">
                            <input type="text" class="input_pin" id="pinCode" placeholder="" maxlength="6" pattern="\d{6}">
                            <div class="pin_progress" id="pinTimer">
                              <div class="progress_header">
                                <div class="progress_label">有效至</div>
                                <div class="progress_text" id="progressText">01:00</div>
                              </div>
                              <div class="progress_bar">
                                <div class="progress_fill" id="progressFill"></div>
                              </div>
                              <div class="resend_link" id="resendLink" style="display: none;">
                                <a href="./index_zh-tw.html">重新發送驗證碼</a>
                              </div>
                            </div>
                          </div>
                          <div class="pin_code_notice">
                            <p>已向 test@iflag.co.jp 發送驗證郵件。</p>
                            <p>請輸入郵件中的驗證碼。</p>
                            <p class="attention_point">若未收到郵件，請查看垃圾郵件資料夾<br/>或確認郵件地址後重新提交。</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  </label>
                </li>
              </ul>
              <div class="input_wrap">
                <div class="back_wrap"><a href="./index_zh-tw.html">修改預約資訊</a></div>
                <p class="submit_wrap">
                  <input type="submit" value="完成預約">
                </p>
              </div>
            </div>
          </div>
        </section>
      </form>
      <div class="foot">© 2025 IFLAG Co, Ltd.</div>
    </main>

    <script src="./assets/js/main.js"></script>
  </body>
</html>
