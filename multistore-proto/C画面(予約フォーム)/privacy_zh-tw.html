        <div class="policy-content-wrapper">
          <section class="policy-section">
            <p style="white-space: pre-wrap;">個人資訊的處理
本診所妥善管理患者的個人資訊，僅用於以下目的。

1. 個人資訊的使用目的
・就診預約管理
・診療相關聯絡
・發送預約確認郵件
・提供診療服務

2. 向第三方提供個人資訊
除法律要求外，未經患者同意，本診所不會向第三方提供個人資訊。

3. 個人資訊的管理
本診所將採取適當的安全措施，防止個人資訊的洩露、遺失或損毀。

4. 個人資訊的公開、更正與刪除
患者可申請公開、更正或刪除其個人資訊。如有需要，請聯繫本所接待處。

5. 諮詢
關於個人資訊處理的諮詢，請聯繫本診所接待處。</p>
          </section>
