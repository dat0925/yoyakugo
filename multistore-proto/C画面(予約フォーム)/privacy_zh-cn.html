            <p style="white-space: pre-wrap;">个人信息的处理
本诊所妥善管理患者的个人信息，仅用于以下目的。

1. 个人信息的使用目的
・就诊预约管理
・诊疗相关联络
・发送预约确认邮件
・提供诊疗服务

2. 向第三方提供个人信息
除法律要求外，未经患者同意，本诊所不会向第三方提供个人信息。

3. 个人信息的管理
本诊所将采取适当的安全措施，防止个人信息的泄露、丢失或损毁。

4. 个人信息的公开、更正与删除
患者可申请公开、更正或删除其个人信息。如有需要，请联系本所接待处。

5. 咨询
关于个人信息处理的咨询，请联系本诊所接待处。</p>
