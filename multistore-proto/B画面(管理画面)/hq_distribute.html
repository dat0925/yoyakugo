<!doctype html>
<html lang="ja">
<head>
  <script src="../pin_gate.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>一括配信｜本部コンソール（多店舗管理プロトタイプ）</title>
    <link href="./style.css" rel="stylesheet">
    <link href="./sp.css" rel="stylesheet">
    <link href="./hq.css" rel="stylesheet">
</head>
<body>
<div class="app">
    <aside id="hqSide"></aside>
    <header id="hqTop"></header>
    <main class="main">
        <div class="hq-head">
            <div>
                <h2>📤 一括配信</h2>
                <div class="sub">本部で1回作れば、選んだ店舗へまとめて配れます。<b>🔒 ロックした項目は店舗で変更できません</b>（料金・キャンセル期限などグループで揃えたいもの）。</div>
            </div>
        </div>
        <ol class="hq-steps" style="padding:0"><li class="on" id="st1">① 配信するものを選ぶ</li><li id="st2">② 店舗で変えてよい項目を決める</li><li id="st3">③ 配信先の店舗を選ぶ</li><li id="st4">④ 確認して配信</li></ol>

        <div class="card">
            <h3>① 配信するもの</h3>
            <div class="hq-tpls" id="tpls"></div>
        </div>

        <div class="grid" style="grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px">
            <div class="card">
                <h3>② 項目ごとのロック</h3>
                <div class="hq-table-wrap">
                    <table class="hq-table" id="items"><thead><tr><th>項目</th><th>本部の値</th><th>店舗での変更</th></tr></thead><tbody></tbody></table>
                </div>
            </div>
            <div class="card">
                <h3>③ 配信先の店舗 <span class="muted" style="font-size:12px;font-weight:400" id="pickCnt"></span></h3>
                <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap" id="areaBtns"></div>
                <div class="hq-storepick" id="pick" style="grid-template-columns:repeat(2,minmax(0,1fr))"></div>
            </div>
        </div>

        <div class="card" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
            <div style="flex:1;min-width:260px"><b>④ 確認</b>　<span id="summary"></span></div>
            <label style="font-size:13px"><input type="radio" name="when" checked> 今すぐ配信</label>
            <label style="font-size:13px"><input type="radio" name="when"> 日時を指定（例：10/1 04:00）</label>
            <button class="regist-btn" onclick="send()">配信する</button>
        </div>

        <div class="card">
            <h3>配信履歴 <span class="muted" style="font-size:12px;font-weight:400">（操作履歴にも「本部による配信」として残ります）</span></h3>
            <div class="hq-table-wrap"><table class="hq-table" id="hist"><thead><tr><th>日時</th><th>実行者</th><th>配信したもの</th><th>配信先</th><th>結果</th></tr></thead><tbody></tbody></table></div>
        </div>
    </main>
</div>
<script src="./js/hq_data.js"></script>
<script src="./js/hq_shell.js"></script>
<script>
(function () {
    let cur = HQ.templates[0];
    const picked = new Set(HQ.stores.filter(s => s.status === '稼働中' && s.menuVer !== 'v3').map(s => s.id).concat(['s1008']));

    function tplView() {
        tpls.innerHTML = HQ.templates.map(t => '<div class="hq-tpl' + (t === cur ? ' sel' : '') + '" data-id="' + t.id + '"><div class="k">' + t.kind + '</div><div class="n">' + t.name + '</div><div class="muted" style="font-size:12px;margin-top:4px">' + t.items.length + ' 項目</div></div>').join('');
        tpls.querySelectorAll('.hq-tpl').forEach(e => e.onclick = () => { cur = HQ.templates.find(t => t.id === e.dataset.id); step(2); all(); });
    }
    function itemView() {
        items.querySelector('tbody').innerHTML = cur.items.map((it, i) =>
            '<tr><td>' + it.label + '</td><td>' + it.value + '</td><td><label class="hq-lock"><input type="checkbox" data-i="' + i + '"' + (it.lock ? ' checked' : '') + '><span></span><em style="font-style:normal">' + (it.lock ? '🔒 変更不可' : '変更可') + '</em></label></td></tr>').join('');
        items.querySelectorAll('input').forEach(e => e.onchange = () => { cur.items[e.dataset.i].lock = e.checked; step(2); all(); });
    }
    function pickView() {
        areaBtns.innerHTML = '<button class="btn ghost" data-a="*">全店</button>' + HQ.areas.map(a => '<button class="btn ghost" data-a="' + a + '">' + a + 'エリア</button>').join('') + '<button class="btn ghost" data-a="">解除</button>';
        areaBtns.querySelectorAll('button').forEach(b => b.onclick = () => {
            picked.clear(); HQ.stores.filter(s => b.dataset.a === '*' || s.area === b.dataset.a).forEach(s => b.dataset.a !== '' && picked.add(s.id)); step(3); all();
        });
        pick.innerHTML = HQ.stores.map(s => '<label><input type="checkbox" value="' + s.id + '"' + (picked.has(s.id) ? ' checked' : '') + '> <span><b>' + s.name + '</b><br><span class="muted" style="font-size:11px">' + s.area + '｜現在 ' + (s.menuVer === '—' ? '未設定' : 'メニュー' + s.menuVer) + '</span></span></label>').join('');
        pick.querySelectorAll('input').forEach(e => e.onchange = () => { e.checked ? picked.add(e.value) : picked.delete(e.value); step(3); all(); });
        pickCnt.textContent = picked.size + ' 店舗を選択中';
    }
    function sum() {
        const locks = cur.items.filter(i => i.lock).length;
        summary.innerHTML = '「<b>' + cur.name + '</b>」を <b>' + picked.size + ' 店舗</b>へ配信します。ロック ' + locks + ' 項目／店舗で変更可 ' + (cur.items.length - locks) + ' 項目。店舗が変更していた「変更可」の項目は上書きしません。';
    }
    function histView() {
        hist.querySelector('tbody').innerHTML = HQ.history.map(h => '<tr><td>' + h.at + '</td><td>' + h.who + '</td><td>' + h.tpl + '</td><td>' + h.to + '</td><td><span class="hq-badge ok">' + h.result + '</span></td></tr>').join('');
    }
    function step(n) { [st1, st2, st3, st4].forEach((e, i) => e.classList.toggle('on', i < n)); }
    function all() { tplView(); itemView(); pickView(); sum(); histView(); }
    window.send = function () {
        if (!picked.size) { HQ_toast('配信先の店舗を選んでください'); return; }
        step(4);
        HQ.history.unshift({ at: '2026/09/23 09:15', who: HQ.me.name, tpl: cur.name, to: picked.size + '店舗', result: '完了' });
        HQ.stores.forEach(s => { if (picked.has(s.id)) { if (cur.id === 't1') s.menuVer = 'v3'; if (cur.id === 't2') s.policy = true; } });
        all();
        HQ_toast(picked.size + ' 店舗へ「' + cur.name + '」を配信しました');
    };
    all();
})();
</script>
</body>
</html>
