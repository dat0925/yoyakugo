<!doctype html>
<html class="no-js" lang="tl">
  <head>
  <script src="../pin_gate.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <link rel="canonical" href="http://www./">
    <title></title>
    <meta name="keywords" content="">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:url" content="http://www./">
    <meta property="og:type" content="website">
    <meta property="og:image" content="">
    <meta property="og:title" content="">
    <meta property="og:site_name" content="">
    <meta property="og:description" content="">
    <link href="./assets/css/main.css" rel="stylesheet">
    <script src="./assets/js/vendor/jquery.min.js"></script>
  </head>
  <body>
    <header>
      <div class="primary_header">
        <div class="container">
          <div class="row">
            <h1 class="title"> ●● Klinika ng Osteopatiya </h1>
            <div class="flow">
              <ul>
                <li>Detalye</li>
                <li class="active">Kumpirmahin</li>
                <li>Kumpleto</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
      <form action="./complete_tl.html" method="post">
        <section class="confirm01">
          <div class="container gutters">
            <div class="text-center text-xlarge">Hindi pa kumpleto ang inyong check-in / reserbasyon.</div>
            <div class="text-center text-large">Suriin ang inyong impormasyon at i-click ang "Kumpletuhin ang Check-in / Reserbasyon" kung tama ang lahat.</div>
            <div class="box">
              <ul>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>Detalye ng Check-in / Reserbasyon</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">Bilang ng Bisita</div>
                        <div class="cell cell-2">1</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Serbisyo</div>
                        <div class="cell cell-2">
                          <div class="confirm_menu_name">Pangalan ng Menu Pangalan ng Menu</div>
                          <ul class="confirm_option_list">
                            <li>+Pangalan ng Opsyon Pangalan ng Opsyon</li>
                            <li>+Pangalan ng Opsyon Pangalan ng Opsyon</li>
                          </ul>
                        </div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Petsa at Oras</div>
                        <div class="cell cell-2">Disyembre 1 (Lun) 10:30</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Staff</div>
                        <div class="cell cell-2">店舗花子</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Presyo (kasama ang buwis)</div>
                        <div class="cell cell-2">3,000 JPY</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Kinakailangang Oras</div>
                        <div class="cell cell-2">45 minuto</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>Impormasyon ng Reserbasyon</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">Pangalan</div>
                        <div class="cell cell-2">Yamada Taro</div>
                      </div>
                      <div class="row" id="furigana_row">
                        <div class="cell cell-1 text-right">Pangalan (Furigana)</div>
                        <div class="cell cell-2"></div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Numero ng Telepono</div>
                        <div class="cell cell-2">03-0000-1111</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Email Address</div>
                        <div class="cell cell-2">test@iflag.co.jp</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Mga Komento</div>
                        <div class="cell cell-2">Nais ko ng babaeng practitioner.</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>Pag-verify ng Email</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">PIN Code</div>
                        <div class="cell cell-2">
                          <div class="pin_input_wrapper">
                            <input type="text" class="input_pin" id="pinCode" placeholder="" maxlength="6" pattern="\d{6}">
                            <div class="pin_progress" id="pinTimer">
                              <div class="progress_header">
                                <div class="progress_label">Valid Hanggang</div>
                                <div class="progress_text" id="progressText">01:00</div>
                              </div>
                              <div class="progress_bar">
                                <div class="progress_fill" id="progressFill"></div>
                              </div>
                              <div class="resend_link" id="resendLink" style="display: none;">
                                <a href="./index_tl.html">Ipadala Muli ang PIN Code</a>
                              </div>
                            </div>
                          </div>
                          <div class="pin_code_notice">
                            <p>Nagpadala na ng verification email sa test@iflag.co.jp.</p>
                            <p>Ilagay ang PIN code mula sa email.</p>
                            <p class="attention_point">Kung hindi ninyo natanggap ang email, suriin ang spam folder<br/>o i-verify ang email address at isumite muli.</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  </label>
                </li>
              </ul>
              <div class="input_wrap">
                <div class="back_wrap"><a href="./index_tl.html">Baguhin ang Detalye ng Check-in / Reserbasyon</a></div>
                <p class="submit_wrap">
                  <input type="submit" value="Kumpletuhin ang Check-in / Reserbasyon">
                </p>
              </div>
            </div>
          </div>
        </section>
      </form>
      <div class="foot">© 2025 IFLAG Co, Ltd.</div>
    </main>

    <script src="./assets/js/main.js"></script>
  </body>
</html>
