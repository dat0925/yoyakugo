<!doctype html>
<html class="no-js" lang="en">
  <head>
  <script src="../pin_gate.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <link rel="canonical" href="http://www./">
    <title></title>
    <meta name="keywords" content="">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:url" content="http://www./">
    <meta property="og:type" content="website">
    <meta property="og:image" content="">
    <meta property="og:title" content="">
    <meta property="og:site_name" content="">
    <meta property="og:description" content="">
    <link href="./assets/css/main.css" rel="stylesheet">
    <script src="./assets/js/vendor/jquery.min.js"></script>
  </head>
  <body>
    <header>
      <div class="primary_header">
        <div class="container">
          <div class="row">
            <h1 class="title"> ●● Osteopathic Clinic </h1>
            <div class="flow">
              <ul>
                <li>Details</li>
                <li class="active">Confirm</li>
                <li>Complete</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
      <form action="./complete_en.html" method="post">
        <section class="confirm01">
          <div class="container gutters">
            <div class="text-center text-xlarge">Your check‑in / reservation is not yet complete.</div>
            <div class="text-center text-large">Please review your entered information and click the "Complete Check‑in / Reservation" button if everything is correct.</div>
            <div class="box">
              <ul>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>Check‑in / Reservation Details</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">Number of Guests</div>
                        <div class="cell cell-2">1</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Service</div>
                        <div class="cell cell-2">
                          <div class="confirm_menu_name">Menu Name Menu Name</div>
                          <ul class="confirm_option_list">
                            <li>+Option Menu Name Option Menu Name</li>
                            <li>+Option Menu Name Option Menu Name</li>
                          </ul>
                        </div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Date & Time</div>
                        <div class="cell cell-2">December 1 (Mon) 10:30</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Staff Member</div>
                        <div class="cell cell-2">店舗花子</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Price (tax incl.)</div>
                        <div class="cell cell-2">3,000 JPY</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Required Time</div>
                        <div class="cell cell-2">45 minutes</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>Reservation Information</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">Name</div>
                        <div class="cell cell-2">Yamada Taro</div>
                      </div>
                      <div class="row" id="furigana_row">
                        <div class="cell cell-1 text-right">Name (Furigana)</div>
                        <div class="cell cell-2"></div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Phone Number</div>
                        <div class="cell cell-2">03-0000-1111</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Email Address</div>
                        <div class="cell cell-2">test@iflag.co.jp</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Comments</div>
                        <div class="cell cell-2">I would like a female practitioner.</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>Email Verification</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">PIN Code</div>
                        <div class="cell cell-2">
                          <div class="pin_input_wrapper">
                            <input type="text" class="input_pin" id="pinCode" placeholder="" maxlength="6" pattern="\d{6}">
                            <div class="pin_progress" id="pinTimer">
                              <div class="progress_header">
                                <div class="progress_label">Valid Until</div>
                                <div class="progress_text" id="progressText">01:00</div>
                              </div>
                              <div class="progress_bar">
                                <div class="progress_fill" id="progressFill"></div>
                              </div>
                              <div class="resend_link" id="resendLink" style="display: none;">
                                <a href="./index_en.html">Resend PIN Code</a>
                              </div>
                            </div>
                          </div>
                          <div class="pin_code_notice">
                            <p>A verification email has been sent to test@iflag.co.jp.</p>
                            <p>Please enter the PIN code from the email.</p>
                            <p class="attention_point">If you do not receive the email, please check your spam folder<br/>or verify the email address you entered and submit again.</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  </label>
                </li>
              </ul>
              <div class="input_wrap">
                <div class="back_wrap"><a href="./index_en.html">Change Check‑in / Reservation Details</a></div>
                <p class="submit_wrap">
                  <input type="submit" value="Complete Check‑in / Reservation">
                </p>
              </div>
            </div>
          </div>
        </section>
      </form>
      <div class="foot">© 2025 IFLAG Co, Ltd.</div>
    </main>

    <script src="./assets/js/main.js"></script>
  </body>
</html>
