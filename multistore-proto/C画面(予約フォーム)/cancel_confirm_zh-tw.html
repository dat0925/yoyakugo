<!doctype html>
<html class="no-js" lang="zh-tw">
  <head>
  <script src="../pin_gate.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>取消預約/就診確認｜●●接骨院</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="./assets/css/main.css" rel="stylesheet">
  </head>
  <body>
    <header>
      <div class="primary_header">
        <div class="container">
          <div class="row">
            <h1 class="title"> ●●接骨院 </h1>
            <div class="flow">
              <ul>
                <li>身分驗證</li>
                <li class="active">取消確認</li>
                <li>取消完成</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
      <form action="./cancel_complete_zh-tw.html" method="get">
        <section class="confirm01 cancel-flow">
          <div class="container gutters">
            <div class="text-center text-xlarge">取消預約/就診確認</div>
            <div class="text-center text-large cancel-lead">
              請確認以下內容，如無問題請點擊「取消預約/就診」按鈕。
            </div>
            <div class="box">
              <ul>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>要取消的預約/就診內容</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">預約/就診編號</div>
                        <div class="cell cell-2">12345</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">人數</div>
                        <div class="cell cell-2">1人</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">預約內容</div>
                        <div class="cell cell-2">
                          <div class="confirm_menu_name">項目名稱</div>
                          <ul class="confirm_option_list">
                            <li>+加購項目名稱加購項目名稱</li>
                            <li>+加購項目名稱加購項目名稱</li>
                          </ul>
                        </div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">預約日期時間</div>
                        <div class="cell cell-2">2026年6月15日（週一）10:30</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">服務人員</div>
                        <div class="cell cell-2">店舗花子</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">費用（含稅）</div>
                        <div class="cell cell-2">3,000 JPY</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">所需時間</div>
                        <div class="cell cell-2">45分鐘</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>預約/就診者資訊</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">姓名</div>
                        <div class="cell cell-2">山田 太郎</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">姓名（假名）</div>
                        <div class="cell cell-2">ヤマダ タロウ</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">電話號碼</div>
                        <div class="cell cell-2">03-0000-1111</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">電子郵件</div>
                        <div class="cell cell-2">test@iflag.co.jp</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">備註</div>
                        <div class="cell cell-2">希望由女性老師服務。</div>
                      </div>
                    </div>
                  </label>
                </li>
              </ul>
              <div class="cancel-notice-box">
                <p>一旦取消後將無法恢復。</p>
                <p>取消完成後，將向登記的電子郵件發送取消完成郵件。</p>
              </div>
              <div class="input_wrap">
                <p class="submit_wrap cancel-submit-wrap">
                  <input type="submit" value="取消預約/就診" class="cancel-submit-btn">
                </p>
              </div>
            </div>
          </div>
        </section>
      </form>
      <div class="foot">© 2025 IFLAG Co, Ltd.</div>
    </main>
  </body>
</html>
