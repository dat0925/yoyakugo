        <!-- Main -->
        <main class="main">
            <!-- メニュー並び替えセクション -->
            <div class="main-section">
                <div class="main-header">
                    <h2 class="main-title">🛠 メニュー並び替え</h2>
                </div>

                <div class="sort-container">
                    <div class="sort-info">
                        <p>▲▼ボタンでメニューの並び替えができます（PCではドラッグも可能です）。</p>
                    </div>

                    <div class="menu-list" id="menuList">
                        <!-- メニューアイテムがここに動的に追加されます -->
                    </div>

                    <div class="sort-actions">
                        <button type="button" class="form-btn modal-btn-save"
                            onclick="saveSortOrder()">並び替えを保存</button>
                        <button type="button" class="form-btn form-btn-cancel sp-page-cancel-btn" onclick="goBack()">キャンセル</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="./js/list_sort_buttons.js"></script>
    <script src="./js/pc_sortable.js"></script>
    <script>
        const sampleMenus = [
            {id: 1, name: 'カット', duration: '60分', price: '3000円'},
            {id: 2, name: 'シャンプー', duration: '60分', price: '2000円'},
            {id: 3, name: '【初めて割】カット', duration: '30分', price: '2500円'},
            {id: 4, name: 'カラーリング', duration: '120分', price: '8000円'},
            {id: 5, name: 'パーマ', duration: '180分', price: '12000円'}
        ];

        document.addEventListener('DOMContentLoaded', function () {
            initializeMenuList();
            ListSortButtons.bind(document.getElementById('menuList'), '.drag-item', updateOrderNumbers);
        });

        function initializeMenuList() {
            const menuList = document.getElementById('menuList');
            menuList.innerHTML = '';

            sampleMenus.forEach((menu, index) => {
                menuList.appendChild(createMenuItem(menu, index + 1));
            });
            updateOrderNumbers();
        }

        function createMenuItem(menu, order) {
            const menuItem = document.createElement('div');
            menuItem.className = 'drag-item';
            menuItem.dataset.menuId = menu.id;

            menuItem.innerHTML =
                '<span class="drag-handle" aria-hidden="true" title="ドラッグで並び替え">⋮⋮</span>' +
                ListSortButtons.html() +
                '<div class="drag-info">' +
                    '<div class="drag-name">' + menu.name + ' | ' + menu.price + ' | ' + menu.duration + '</div>' +
                '</div>' +
                '<div class="drag-order">' + order + '</div>';

            return menuItem;
        }

        function updateOrderNumbers() {
            document.querySelectorAll('#menuList .drag-item').forEach((item, index) => {
                const orderElement = item.querySelector('.drag-order');
                if (orderElement) orderElement.textContent = index + 1;
            });
        }

        function saveSortOrder() {
            const menuItems = document.querySelectorAll('#menuList .drag-item');
            const newOrder = Array.from(menuItems).map(item => ({
                id: parseInt(item.dataset.menuId, 10),
                order: Array.from(menuItems).indexOf(item) + 1
            }));

            console.log('新しい並び順:', newOrder);
            window.location.href = './admin_menus.html';
        }

        function goBack() {
            window.history.back();
        }
    </script>
</body>
