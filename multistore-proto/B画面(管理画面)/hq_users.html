<!doctype html>
<html lang="ja">
<head>
  <script src="../pin_gate.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ユーザー・権限｜本部コンソール（多店舗管理プロトタイプ）</title>
    <link href="./style.css" rel="stylesheet">
    <link href="./sp.css" rel="stylesheet">
    <link href="./hq.css" rel="stylesheet">
</head>
<body>
<div class="app">
    <aside id="hqSide"></aside>
    <header id="hqTop"></header>
    <main class="main">
        <div class="hq-head">
            <div>
                <h2>🔐 ユーザー・権限</h2>
                <div class="sub">本部のユーザーは店舗の外に置き、<b>1つのメールアドレスで複数店舗</b>を担当できます。店舗側のスタッフ管理（既存）はそのまま使えます。</div>
            </div>
            <button class="regist-btn" onclick="HQ_toast('招待メールを送る画面を開きます（プロトタイプ）')">＋ ユーザーを招待</button>
        </div>
        <div class="hq-table-wrap">
            <table class="hq-table" id="users"><thead><tr><th>名前</th><th>メールアドレス（ログインID）</th><th>ロール</th><th>担当店舗</th><th>操作</th></tr></thead><tbody></tbody></table>
        </div>
        <div class="card">
            <h3>ロールごとにできること</h3>
            <div class="hq-table-wrap">
                <table class="hq-table hq-matrix" id="mx"><thead><tr><th>操作</th><th>本部管理者</th><th>エリアマネージャー</th><th>店舗管理者（店長）</th><th>スタッフ</th></tr></thead><tbody></tbody></table>
            </div>
            <div class="muted" style="font-size:12px;margin-top:8px">○＝できる　△＝担当店舗だけ　×＝できない。店舗管理者・スタッフは、現在の「管理者権限 ON／OFF」と同じ範囲です（既存店舗の運用は変わりません）。</div>
        </div>
    </main>
</div>
<script src="./js/hq_data.js"></script>
<script src="./js/hq_shell.js"></script>
<script>
(function () {
    users.querySelector('tbody').innerHTML = HQ.users.map(u => {
        const r = HQ.roles[u.role];
        const st = u.stores[0] === '*' ? '<span class="hq-badge blue">全店</span>' : u.stores.map(id => '<span class="hq-badge gray">' + HQ.store(id).name + '</span>').join(' ');
        return '<tr><td><b>' + u.name + '</b></td><td>' + u.mail + '</td><td><span class="hq-badge" style="background:' + r.color + '1a;color:' + r.color + '">' + r.label + '</span></td><td>' + st + '</td><td><button class="link-btn" onclick="HQ_toast(\'編集（プロトタイプ）\')">編集</button></td></tr>';
    }).join('');
    const cls = v => v === '○' ? 'o' : v === '△' ? 't' : 'x';
    mx.querySelector('tbody').innerHTML = HQ.perms.map(p => '<tr><td>' + p[0] + '</td>' + p.slice(1).map(v => '<td class="c ' + cls(v) + '">' + v + '</td>').join('') + '</tr>').join('');
})();
</script>
</body>
</html>
