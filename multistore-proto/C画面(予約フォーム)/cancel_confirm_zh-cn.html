<!doctype html>
<html class="no-js" lang="zh-cn">
  <head>
  <script src="../pin_gate.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>取消预约/就诊确认｜●●接骨院</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="./assets/css/main.css" rel="stylesheet">
  </head>
  <body>
    <header>
      <div class="primary_header">
        <div class="container">
          <div class="row">
            <h1 class="title"> ●●接骨院 </h1>
            <div class="flow">
              <ul>
                <li>身份验证</li>
                <li class="active">取消确认</li>
                <li>取消完成</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
      <form action="./cancel_complete_zh-cn.html" method="get">
        <section class="confirm01 cancel-flow">
          <div class="container gutters">
            <div class="text-center text-xlarge">取消预约/就诊确认</div>
            <div class="text-center text-large cancel-lead">
              请确认以下内容，如无问题请点击「取消预约/就诊」按钮。
            </div>
            <div class="box">
              <ul>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>要取消的预约/就诊内容</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">预约/就诊编号</div>
                        <div class="cell cell-2">12345</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">人数</div>
                        <div class="cell cell-2">1人</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">预约内容</div>
                        <div class="cell cell-2">
                          <div class="confirm_menu_name">项目名称</div>
                          <ul class="confirm_option_list">
                            <li>+附加项目名称附加项目名称</li>
                            <li>+附加项目名称附加项目名称</li>
                          </ul>
                        </div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">预约日期时间</div>
                        <div class="cell cell-2">2026年6月15日（周一）10:30</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">服务人员</div>
                        <div class="cell cell-2">店舗花子</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">费用（含税）</div>
                        <div class="cell cell-2">3,000 JPY</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">所需时间</div>
                        <div class="cell cell-2">45分钟</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>预约/就诊者信息</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">姓名</div>
                        <div class="cell cell-2">山田 太郎</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">姓名（假名）</div>
                        <div class="cell cell-2">ヤマダ タロウ</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">电话号码</div>
                        <div class="cell cell-2">03-0000-1111</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">电子邮箱</div>
                        <div class="cell cell-2">test@iflag.co.jp</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">备注</div>
                        <div class="cell cell-2">希望由女性老师服务。</div>
                      </div>
                    </div>
                  </label>
                </li>
              </ul>
              <div class="cancel-notice-box">
                <p>一旦取消后将无法恢复。</p>
                <p>取消完成后，将向登记的电子邮箱发送取消完成邮件。</p>
              </div>
              <div class="input_wrap">
                <p class="submit_wrap cancel-submit-wrap">
                  <input type="submit" value="取消预约/就诊" class="cancel-submit-btn">
                </p>
              </div>
            </div>
          </div>
        </section>
      </form>
      <div class="foot">© 2025 IFLAG Co, Ltd.</div>
    </main>
  </body>
</html>
