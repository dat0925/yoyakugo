<!doctype html>
<html class="no-js" lang="zh-tw">
  <head>
  <script src="../pin_gate.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>取消預約/就診（身分驗證）｜●●接骨院</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="./assets/css/main.css" rel="stylesheet">
  </head>
  <body>
    <header>
      <div class="primary_header">
        <div class="container">
          <div class="row">
            <h1 class="title"> ●●接骨院 </h1>
            <div class="flow">
              <ul>
                <li class="active">身分驗證</li>
                <li>取消確認</li>
                <li>取消完成</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
      <form action="./cancel_confirm_zh-tw.html" method="get" id="cancelVerifyForm" novalidate>
        <section class="confirm01 cancel-flow">
          <div class="container gutters">
            <div class="text-center text-xlarge">取消預約/就診（身分驗證）</div>
            <div class="text-center text-large cancel-lead">
              請輸入預約/就診時登記的電話號碼的<strong>後4碼</strong>。
            </div>
            <div class="alert alert-danger alert-error-message clear-after-action" id="alert-error-message" style="display:none"></div>
            <div class="box">
              <ul>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>電話號碼（後4碼）</span>
                    </span>
                    <div class="table-container">
                      <div class="row cancel-tel-row">
                        <div class="cell cell-1 text-right cancel-tel-label-cell">後4碼<span class="required">必填</span></div>
                        <div class="cell cell-2">
                          <div class="cancel-tel-last4-wrap">
                            <input type="text" class="input_tel02 cancel-tel-last4" id="telLast4_1" name="telLast4_1" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="電話號碼後4碼 1">
                            <input type="text" class="input_tel02 cancel-tel-last4" id="telLast4_2" name="telLast4_2" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="電話號碼後4碼 2">
                            <input type="text" class="input_tel02 cancel-tel-last4" id="telLast4_3" name="telLast4_3" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="電話號碼後4碼 3">
                            <input type="text" class="input_tel02 cancel-tel-last4" id="telLast4_4" name="telLast4_4" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="電話號碼後4碼 4">
                          </div>
                          <p class="cancel-help-text">例：03-0000-<strong>1111</strong> 請輸入「1111」</p>
                        </div>
                      </div>
                    </div>
                  </label>
                </li>
              </ul>
              <div class="input_wrap">
                <p class="submit_wrap">
                  <input type="submit" value="確認">
                </p>
              </div>
            </div>
          </div>
        </section>
      </form>
      <div class="foot">© 2025 IFLAG Co, Ltd.</div>
    </main>
    <script>
      (function() {
        var telErrorMessage = '後4位不正確。請重新輸入。';
        var form = document.getElementById('cancelVerifyForm');
        var alertError = document.getElementById('alert-error-message');
        var inputs = document.querySelectorAll('.cancel-tel-last4');

        function showAlertError(message) {
          alertError.innerHTML = '<p>' + message + '</p>';
          alertError.style.display = '';
        }

        function clearAlertError() {
          alertError.innerHTML = '';
          alertError.style.display = 'none';
        }

        inputs.forEach(function(input, index) {
          input.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 1);
            clearAlertError();
            if (this.value && inputs[index + 1]) {
              inputs[index + 1].focus();
            }
          });
          input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && !this.value && inputs[index - 1]) {
              inputs[index - 1].focus();
            }
          });
        });

        form.addEventListener('submit', function(e) {
          e.preventDefault();
          clearAlertError();
          var telLast4 = '';
          inputs.forEach(function(input) {
            telLast4 += input.value;
          });
          if (!/^[0-9]{4}$/.test(telLast4) || telLast4 !== '1111') {
            showAlertError(telErrorMessage);
            return false;
          }
          window.location.href = form.getAttribute('action');
          return false;
        });
      })();
    </script>
  </body>
</html>
