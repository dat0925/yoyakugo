<!doctype html>
<html lang="ja">
<head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>受付・予約詳細｜管理画面モック</title>
    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            var qs = new URLSearchParams({ open: 'detail' });
            ['id', 'date', 'time', 'resource'].forEach(function (key) {
                if (params.get(key)) qs.set(key, params.get(key));
            });
            location.replace('./admin_reservations.html?' + qs.toString());
        })();
    </script>
</head>
<body>
    <p>受付・予約管理画面のモーダルへ移動しています…</p>
