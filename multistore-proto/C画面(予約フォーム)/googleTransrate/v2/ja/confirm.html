<!doctype html>
<html class="no-js" lang="ja">
  <head>
  <script src="../../../../pin_gate.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <link rel="canonical" href="http://www./">
    <title></title>
    <meta name="keywords" content="">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:url" content="http://www./">
    <meta property="og:type" content="website">
    <meta property="og:image" content="">
    <meta property="og:title" content="">
    <meta property="og:site_name" content="">
    <meta property="og:description" content="">
    <link href="../assets/css/main.css" rel="stylesheet">
    <script src="../assets/js/vendor/jquery.min.js"></script>
  </head>
  <body>
    <header>
      <div class="primary_header">
        <div class="container">
          <div class="row">
            <h1 class="title"> ●●接骨院 </h1>
            <div class="flow">
              <ul>
                <li>受付・予約情報入力</li>
                <li class="active">受付・予約確認</li>
                <li>受付・予約完了</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
      <form action="./complete.html" method="post">
        <section class="confirm01">
          <div class="container gutters">
            <div class="text-center text-xlarge">受付・予約はまだ完了していません。</div>
            <div class="text-center text-large">入力内容をご確認の上、間違いがなければ「受付・予約する」ボタンをクリックしてください。</div>
            <div class="box">
              <ul>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>受付・予約内容</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">受付内容</div>
                        <div class="cell cell-2">メニュー1</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">受付日時</div>
                        <div class="cell cell-2">12月1日（月）10:30</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>受付・予約者情報</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">お名前</div>
                        <div class="cell cell-2">山田　太郎</div>
                      </div>
                      <div class="row" id="furigana_row">
                        <div class="cell cell-1 text-right">お名前（フリガナ）</div>
                        <div class="cell cell-2">ヤマダ　タロウ</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">電話番号</div>
                        <div class="cell cell-2">03-0000-1111</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">メールアドレス</div>
                        <div class="cell cell-2">test@iflag.co.jp</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">コメント</div>
                        <div class="cell cell-2">女性の先生を希望します。</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>メールアドレスの受信確認</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">PINコード</div>
                        <div class="cell cell-2">
                          <div class="pin_input_wrapper">
                            <input type="text" class="input_pin" id="pinCode" placeholder="" maxlength="6" pattern="\d{6}">
                            <div class="pin_progress" id="pinTimer">
                              <div class="progress_header">
                                <div class="progress_label">有効期限</div>
                                <div class="progress_text" id="progressText">01:00</div>
                              </div>
                              <div class="progress_bar">
                                <div class="progress_fill" id="progressFill"></div>
                              </div>
                              <div class="resend_link" id="resendLink" style="display: none;">
                                <a href="./index.html">PINコードを再送する</a>
                              </div>
                            </div>
                          </div>
                          <div class="pin_code_notice">
                            <p>test@iflag.co.jpに確認用メールを送信しました。</p>
                            <p>メールに記載のPINコードを入力してください。</p>
                            <p class="attention_point">メールが届かない場合は、迷惑メールフォルダをご確認いただくか<br/>入力したメールアドレスを確認し、再度お申し込みください。</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  </label>
                </li>
              </ul>
              <div class="input_wrap">
                <div class="back_wrap"><a href="./index.html">受付・予約内容を変更する</a></div>
                <p class="submit_wrap">
                  <input type="submit" value="受付・予約する">
                </p>
              </div>
            </div>
          </div>
        </section>
      </form>
      <div class="foot">© 2025 IFLAG Co, Ltd.</div>
    </main>

    <script src="../assets/js/main.js"></script>
  </body>
</html>
