<!doctype html>
<html lang="ja">
<head>
  <script src="../pin_gate.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アイフラッグ整骨院グループ｜ご予約の店舗を選ぶ</title>
  <link href="./assets/css/main.css" rel="stylesheet">
  <style>
    /* グループ予約ページ（多店舗管理プロトタイプ）。既存の予約フォーム main.css の上に最小限だけ足す */
    body { background: #f7f9fc; }
    .gs-wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
    .gs-head { background: #fff; border-bottom: 1px solid #dcdcdc; }
    .gs-head .in { max-width: 960px; margin: 0 auto; padding: 18px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .gs-head h1 { font-size: 22px; margin: 0; letter-spacing: .06em; }
    .gs-head .lead { font-size: 13px; color: #495057; }
    .gs-flow { display: flex; gap: 0; margin: 14px 0 6px; padding: 0; }
    .gs-flow li { list-style: none; flex: 1; text-align: center; font-size: 13px; padding: 8px 4px; background: #e9ecef; color: #495057; }
    .gs-flow li.on { background: #cf3838; color: #fff; font-weight: 700; }
    .gs-areas { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .gs-areas button { border: 1px solid #cf3838; background: #fff; color: #cf3838; border-radius: 99px; padding: 8px 18px; font-size: 14px; cursor: pointer; }
    .gs-areas button.on { background: #cf3838; color: #fff; }
    .gs-search { width: 100%; padding: 12px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    .gs-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
    .gs-card { background: #fff; border: 1px solid #dcdcdc; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
    .gs-card .gs-name { font-size: 18px; font-weight: 700; margin: 0; }
    .gs-card .ad { font-size: 13px; color: #495057; }
    .gs-card .nx { font-size: 13px; }
    .gs-card .nx b { color: #cf3838; }
    .gs-card .tags span { display: inline-block; font-size: 11px; border: 1px solid #ccc; border-radius: 4px; padding: 1px 6px; margin-right: 4px; color: #495057; }
    .gs-btn { margin-top: 6px; display: block; text-align: center; background: #cf3838; color: #fff !important; border-radius: 8px; padding: 12px; font-weight: 700; text-decoration: none; }
    .gs-card.soon { opacity: .6; } .gs-card.soon .gs-btn { background: #adb5bd; pointer-events: none; }
    .gs-note { font-size: 12px; color: #6c757d; margin-top: 18px; }
    @media (max-width: 640px) { .gs-list { grid-template-columns: 1fr; } .gs-head h1 { font-size: 18px; } }
  </style>
</head>
<body>
  <div class="gs-head"><div class="in">
    <div><h1>アイフラッグ整骨院グループ</h1><div class="lead">ご予約の院をお選びください。24時間WEBで予約できます。</div></div>
    <div class="lead">📞 お電話は各院へ</div>
  </div></div>
  <div class="gs-wrap">
    <ul class="gs-flow"><li class="on">院を選ぶ</li><li>人数・メニュー</li><li>担当者・日時選択</li><li>受付・予約者情報</li></ul>
    <div class="gs-areas" id="areas"></div>
    <input class="gs-search" id="q" type="search" placeholder="駅名・地名で探す（例：新宿、横浜）">
    <div class="gs-list" id="list"></div>
    <p class="gs-note">※このページは本部が1つ持つ「グループ予約ページ」です。チェーンの公式サイトやGoogleビジネスプロフィールには、このURLを1本貼るだけで全院の予約を受けられます（多店舗管理プロトタイプ）。</p>
  </div>
  <script src="../B画面(管理画面)/js/hq_data.js"></script>
  <script>
  (function () {
    // 次の空き（ダミー）
    const next = { s1001: '本日 14:30', s1002: '本日 11:00', s1003: '本日 16:00', s1004: '本日 12:30', s1005: '本日 15:00', s1006: '明日 10:00', s1007: '本日 17:30' };
    const tags = { s1001: ['駅徒歩3分', '土日祝営業', '鍼灸'], s1002: ['駅徒歩5分', '産後ケア'], s1003: ['駅徒歩2分', '夜21時まで'], s1004: ['駅徒歩1分'], s1005: ['駅直結', '土日祝営業', '多言語'], s1006: ['駅徒歩4分'], s1007: ['駐車場あり'], s1008: ['10月オープン'] };
    let area = '';
    areas.innerHTML = '<button class="on" data-a="">すべて</button>' + HQ.areas.map(a => '<button data-a="' + a + '">' + a + '</button>').join('');
    areas.querySelectorAll('button').forEach(b => b.onclick = () => { area = b.dataset.a; areas.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); render(); });
    q.oninput = render;
    function render() {
      const kw = q.value.trim();
      list.innerHTML = HQ.stores.filter(s => (!area || s.area === area) && (!kw || (s.name + s.addr).includes(kw))).map(s => {
        const soon = s.status !== '稼働中';
        return '<div class="gs-card' + (soon ? ' soon' : '') + '"><div class="gs-name">' + s.name + '</div><div class="ad">📍 ' + s.addr + '</div>' +
          '<div class="tags">' + (tags[s.id] || []).map(t => '<span>' + t + '</span>').join('') + '</div>' +
          '<div class="nx">' + (soon ? '準備中（オープン後に予約を受け付けます）' : '次に空いている枠：<b>' + next[s.id] + '</b>') + '</div>' +
          '<a class="gs-btn" href="./index.html?store=' + s.id + '">この院で予約する</a></div>';
      }).join('') || '<p>該当する院がありません</p>';
    }
    render();
  })();
  </script>
</body>
</html>
