<!doctype html>
<html class="no-js" lang="vi">
  <head>
  <script src="../pin_gate.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <link rel="canonical" href="http://www./">
    <title></title>
    <meta name="keywords" content="">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:url" content="http://www./">
    <meta property="og:type" content="website">
    <meta property="og:image" content="">
    <meta property="og:title" content="">
    <meta property="og:site_name" content="">
    <meta property="og:description" content="">
    <link href="./assets/css/main.css" rel="stylesheet">
    <script src="./assets/js/vendor/jquery.min.js"></script>
  </head>
  <body>
    <header>
      <div class="primary_header">
        <div class="container">
          <div class="row">
            <h1 class="title"> ●● Phòng khám chỉnh xương </h1>
            <div class="flow">
              <ul>
                <li>Chi tiết</li>
                <li class="active">Xác nhận</li>
                <li>Hoàn tất</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
      <form action="./complete_vi.html" method="post">
        <section class="confirm01">
          <div class="container gutters">
            <div class="text-center text-xlarge">Check-in / đặt chỗ của bạn chưa hoàn tất.</div>
            <div class="text-center text-large">Vui lòng kiểm tra thông tin đã nhập và nhấn "Hoàn tất check-in / đặt chỗ" nếu mọi thứ đúng.</div>
            <div class="box">
              <ul>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>Chi tiết check-in / đặt chỗ</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">Số khách</div>
                        <div class="cell cell-2">1</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Dịch vụ</div>
                        <div class="cell cell-2">
                          <div class="confirm_menu_name">Tên thực đơn Tên thực đơn</div>
                          <ul class="confirm_option_list">
                            <li>+Tên menu tùy chọn Tên menu tùy chọn</li>
                            <li>+Tên menu tùy chọn Tên menu tùy chọn</li>
                          </ul>
                        </div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Ngày & Giờ</div>
                        <div class="cell cell-2">1 tháng 12 (Th 2) 10:30</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Nhân viên</div>
                        <div class="cell cell-2">店舗花子</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Phí (đã gồm thuế)</div>
                        <div class="cell cell-2">3,000 JPY</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Thời gian cần</div>
                        <div class="cell cell-2">45 phút</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>Thông tin đặt chỗ</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">Họ tên</div>
                        <div class="cell cell-2">Yamada Taro</div>
                      </div>
                      <div class="row" id="furigana_row">
                        <div class="cell cell-1 text-right">Họ tên (Furigana)</div>
                        <div class="cell cell-2"></div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Số điện thoại</div>
                        <div class="cell cell-2">03-0000-1111</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Địa chỉ email</div>
                        <div class="cell cell-2">test@iflag.co.jp</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">Ghi chú</div>
                        <div class="cell cell-2">Tôi muốn được điều trị bởi nữ nhân viên y tế.</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>Xác minh email</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">Mã PIN</div>
                        <div class="cell cell-2">
                          <div class="pin_input_wrapper">
                            <input type="text" class="input_pin" id="pinCode" placeholder="" maxlength="6" pattern="\d{6}">
                            <div class="pin_progress" id="pinTimer">
                              <div class="progress_header">
                                <div class="progress_label">Hiệu lực đến</div>
                                <div class="progress_text" id="progressText">01:00</div>
                              </div>
                              <div class="progress_bar">
                                <div class="progress_fill" id="progressFill"></div>
                              </div>
                              <div class="resend_link" id="resendLink" style="display: none;">
                                <a href="./index_vi.html">Gửi lại mã PIN</a>
                              </div>
                            </div>
                          </div>
                          <div class="pin_code_notice">
                            <p>Email xác minh đã gửi tới test@iflag.co.jp.</p>
                            <p>Vui lòng nhập mã PIN từ email.</p>
                            <p class="attention_point">Nếu không nhận được email, kiểm tra thư mục spam<br/>hoặc xác minh địa chỉ email và gửi lại.</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  </label>
                </li>
              </ul>
              <div class="input_wrap">
                <div class="back_wrap"><a href="./index_vi.html">Thay đổi chi tiết check-in / đặt chỗ</a></div>
                <p class="submit_wrap">
                  <input type="submit" value="Hoàn tất check-in / đặt chỗ">
                </p>
              </div>
            </div>
          </div>
        </section>
      </form>
      <div class="foot">© 2025 IFLAG Co, Ltd.</div>
    </main>

    <script src="./assets/js/main.js"></script>
  </body>
</html>
