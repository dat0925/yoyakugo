<!doctype html>
<html class="no-js" lang="ko">
  <head>
  <script src="../pin_gate.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>예약/내원 취소 확인｜●●접골원</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="./assets/css/main.css" rel="stylesheet">
  </head>
  <body>
    <header>
      <div class="primary_header">
        <div class="container">
          <div class="row">
            <h1 class="title"> ●●접골원 </h1>
            <div class="flow">
              <ul>
                <li>본인 확인</li>
                <li class="active">취소 확인</li>
                <li>취소 완료</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
      <form action="./cancel_complete_ko.html" method="get">
        <section class="confirm01 cancel-flow">
          <div class="container gutters">
            <div class="text-center text-xlarge">예약/내원 취소 확인</div>
            <div class="text-center text-large cancel-lead">
              내용을 확인하신 후 문제가 없으면 「예약/내원 취소」버튼을 클릭해 주세요.
            </div>
            <div class="box">
              <ul>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>취소 대상 예약/내원 내용</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">예약/내원 번호</div>
                        <div class="cell cell-2">12345</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">인원</div>
                        <div class="cell cell-2">1명</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">예약 내용</div>
                        <div class="cell cell-2">
                          <div class="confirm_menu_name">메뉴명</div>
                          <ul class="confirm_option_list">
                            <li>+옵션 메뉴명 옵션 메뉴명</li>
                            <li>+옵션 메뉴명 옵션 메뉴명</li>
                          </ul>
                        </div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">예약 일시</div>
                        <div class="cell cell-2">2026년 6월 15일（월）10:30</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">담당자</div>
                        <div class="cell cell-2">店舗花子</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">요금(세금 포함)</div>
                        <div class="cell cell-2">3,000 JPY</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">소요시간</div>
                        <div class="cell cell-2">45분</div>
                      </div>
                    </div>
                  </label>
                </li>
                <li>
                  <label>
                    <span class="title_txt">
                      <span>예약/내원자 정보</span>
                    </span>
                    <div class="table-container">
                      <div class="row">
                        <div class="cell cell-1 text-right">이름</div>
                        <div class="cell cell-2">야마다 타로</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">이름（후리가나）</div>
                        <div class="cell cell-2">ヤマダ タロウ</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">전화번호</div>
                        <div class="cell cell-2">03-0000-1111</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">이메일</div>
                        <div class="cell cell-2">test@iflag.co.jp</div>
                      </div>
                      <div class="row">
                        <div class="cell cell-1 text-right">코멘트</div>
                        <div class="cell cell-2">여성 선생님을 희망합니다.</div>
                      </div>
                    </div>
                  </label>
                </li>
              </ul>
              <div class="cancel-notice-box">
                <p>한 번 취소하면 되돌릴 수 없습니다.</p>
                <p>취소 완료 후 등록된 이메일 주소로 취소 완료 메일을 발송합니다.</p>
              </div>
              <div class="input_wrap">
                <p class="submit_wrap cancel-submit-wrap">
                  <input type="submit" value="예약/내원 취소" class="cancel-submit-btn">
                </p>
              </div>
            </div>
          </div>
        </section>
      </form>
      <div class="foot">© 2025 IFLAG Co, Ltd.</div>
    </main>
  </body>
</html>
